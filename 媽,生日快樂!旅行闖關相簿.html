<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>媽,生日快樂!旅行闖關相簿</title>
<style>
:root{--bg:#e8f5fa;--card:#fff;--ink:#12304a;--sub:#4d6a80;--pink:#e8457c;--sun:#ffc93c;--teal:#1d8a99;--line:#c3dde8;--ok:#1f9d6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a;--card:#162a3d;--ink:#eaf5fb;--sub:#9fbccd;--pink:#ff6b9a;--sun:#ffd25e;--teal:#4cc3d2;--line:#2b455b;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#0d1b2a;--card:#162a3d;--ink:#eaf5fb;--sub:#9fbccd;--pink:#ff6b9a;--sun:#ffd25e;--teal:#4cc3d2;--line:#2b455b;--ok:#4cc38a}
html{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;padding:18px 18px 36px}
h1{font-size:34px;line-height:1.25;margin:10px 0;font-weight:900;letter-spacing:.02em}
h2{font-size:21px;margin:18px 0 12px;font-weight:800}
p{margin:6px 0;color:var(--sub);font-size:16px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;margin-bottom:14px}
.bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink));transition:width .5s}
.pol{background:#fff;padding:10px 10px 14px;border-radius:6px;box-shadow:0 6px 20px rgba(18,48,74,.18);transform:rotate(-1.2deg)}
.frame{position:relative;overflow:hidden;display:flex;justify-content:center;background:#cfe3ec;min-height:150px}
.frame img{display:block;max-width:100%;max-height:50vh;width:auto;height:auto}
.frame.open img{filter:none;transform:none}
.q{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;transition:opacity .4s;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.35)}
.open .q{opacity:0}
.stamp{position:absolute;right:10px;bottom:10px;width:104px;height:104px;border-radius:50%;border:3px dashed var(--pink);background:rgba(255,255,255,.82);color:var(--pink);display:grid;place-items:center;text-align:center;font-weight:900;font-size:18px;line-height:1.2;padding:8px;transform:rotate(-14deg);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.stamp small{display:block;font-size:11px;font-weight:700;color:#12304a}
@keyframes pop{from{transform:rotate(-40deg) scale(2.4);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:15px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700}
.opt:active{transform:scale(.97)}
.opt.wrong{animation:shake .4s;opacity:.4;border-color:var(--pink)}
.opt.right{border-color:var(--ok);background:var(--ok);color:#fff}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hint{text-align:center;color:var(--pink);font-weight:700}
.cap{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card);border-left:6px solid var(--sun)}
.cap b{font-size:17px}
.go{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--pink);color:#fff;font-size:19px;font-weight:800}
.hero{text-align:center;padding-top:6vh}
.big{font-size:84px;line-height:1}
.fin{text-align:center}
.mini{display:flex;gap:6px;margin:16px 0}
.mini img{flex:1;min-width:0;height:64px;object-fit:cover;border-radius:8px;border:2px solid #fff}
.sign{margin-top:14px;font-weight:700;color:var(--ink)}
.rain{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rain{display:none}.stamp,.opt.wrong{animation:none}.frame img{transition:none}}
</style>
</head>

];
const app=document.getElementById('app');
let i=0;
function burst(n){for(let k=0;k<n;k++){const s=document.createElement('span');s.className='rain';s.textContent=['🎉','✨','🎈','💖','🌸'][k%5];s.style.left=Math.random()*96+'vw';s.style.fontSize=(18+Math.random()*18)+'px';s.style.animationDuration=(2+Math.random()*2.2)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4600)}}
function start(){
app.innerHTML=`<div class="hero"><div class="big">🎂</div><h1>媽,生日快樂!</h1><p>今天準備了一個小遊戲。</p><p>一共 ${L.length} 關,猜對地點就能解鎖照片,<br>最後還有一份驚喜等你。</p><button class="go" id="s" style="margin-top:28px">開始闖關</button></div>`;
document.getElementById('s').onclick=()=>{i=0;level()};
}
function level(){
const l=L[i],opts=[l.a,...l.o].sort(()=>Math.random()-.5);let done=false;
app.innerHTML=`<div class="top"><span>第 ${i+1} 關 / ${L.length}</span><div class="bar"><i style="width:${i/L.length*100}%"></i></div></div><div class="pol"><div class="frame" id="fr"><img src="${l.img}" alt=""></div></div><h2>${l.q}</h2><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div id="res"></div>`;
const fr=document.getElementById('fr'),res=document.getElementById('res');
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
if(done)return;
if(b.textContent===l.a){done=true;b.classList.add('right');fr.classList.add('open');fr.querySelector('img').alt=l.a;
fr.insertAdjacentHTML('beforeend',`<div class="stamp"><div>${l.a}<small>通關!</small></div></div>`);
res.innerHTML=`<div class="cap"><b>${l.when}・${l.a}</b><p>${l.cap}</p><button class="go" id="n">${i<L.length-1?'下一關':'解鎖最後的驚喜 🎁'}</button></div>`;
burst(14);document.getElementById('n').onclick=()=>{i++;i<L.length?level():finale()};
setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'end'}),300);
}else{b.classList.add('wrong');b.disabled=true;res.innerHTML='<p class="hint">不是這個,再想想看!</p>'}
});
window.scrollTo(0,0);
}
function finale(){
app.innerHTML=`<div class="fin"><div class="big">🎂</div><h1>媽,生日快樂!</h1><p>謝謝你一直陪著我們,<br>把每一次出發都變成最好的回憶。</p><div class="mini">${L.map(l=>`<img src="${l.img}" alt="${l.a}">`).join('')}</div><h2>下一站,我們繼續一起去玩!<br>你想去哪裡?</h2><div class="opts"><button class="opt">🌸 日本</button><button class="opt">🏝️ 海島</button><button class="opt">🏔️ 山林</button><button class="opt">🍜 你決定</button></div><div id="res"></div><p class="sign">愛你的家人</p></div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.getElementById('res').innerHTML=`<div class="cap"><b>${b.textContent.trim()},說定囉!</b><p>下一張照片,就等我們一起去拍。</p></div>`;burst(24)});
burst(40);window.scrollTo(0,0);
}
start();
</script>
